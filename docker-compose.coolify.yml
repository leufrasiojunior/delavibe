services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delavibe}
      POSTGRES_USER: ${POSTGRES_USER:-delavibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-delavibe} -d ${POSTGRES_DB:-delavibe}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-delavibe}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-delavibe}?schema=public
      NODE_ENV: production
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_NAME: pdv_session
      CSRF_COOKIE_NAME: pdv_csrf
      NEXT_PUBLIC_CSRF_COOKIE_NAME: pdv_csrf
      SESSION_TTL_HOURS: "12"
      APP_TIMEZONE: America/Sao_Paulo
      NEXT_PUBLIC_APP_NAME: "Dela's Vibe PDV"
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-delavibe}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-delavibe}?schema=public
      NODE_ENV: production
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_NAME: pdv_session
      CSRF_COOKIE_NAME: pdv_csrf
      NEXT_PUBLIC_CSRF_COOKIE_NAME: pdv_csrf
      SESSION_TTL_HOURS: "12"
      APP_TIMEZONE: America/Sao_Paulo
      NEXT_PUBLIC_APP_NAME: "Dela's Vibe PDV"
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

volumes:
  postgres_data:
