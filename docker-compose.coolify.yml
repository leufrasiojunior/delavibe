# Coolify (producao): stack apenas da aplicacao.
# O banco Postgres roda em um stack SEPARADO no mesmo projeto Coolify
# (ver docker-compose.db.yml) e é alcançado via DNS interno do Coolify
# (ex.: postgres-<stack-id>:5432). DATABASE_URL deve ser configurada
# nas env vars do Coolify para este stack apontando para a URL interna.
#
# Migrations rodam automaticamente no entrypoint do container do app.
# Seed é manual: docker exec <container> npm run db:seed
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (aponte para a URL interna do stack de DB)}
      NODE_ENV: production
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_NAME: __Host-pdv_session
      CSRF_COOKIE_NAME: __Host-pdv_csrf
      NEXT_PUBLIC_CSRF_COOKIE_NAME: __Host-pdv_csrf
      SESSION_TTL_HOURS: "12"
      APP_TIMEZONE: America/Sao_Paulo
      NEXT_PUBLIC_APP_NAME: "Dela's Vibe PDV"
      TRUST_PROXY_HEADERS: "true"
      TZ: America/Sao_Paulo
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "3000"

volumes:
  uploads_data:
