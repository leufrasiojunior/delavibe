# Coolify (producao): stack apenas da aplicacao.
# O banco Postgres roda como recurso SEPARADO no mesmo projeto Coolify
# (criado pela UI: + New Resource > Database > PostgreSQL) e é alcançado
# via DNS interno do Coolify. DATABASE_URL deve ser configurada nas env
# vars deste stack apontando para a URL interna do recurso Postgres.
#
# Migrations rodam automaticamente no entrypoint do container do app.
# Seed é manual: docker exec <container> npm run db:seed
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (aponte para a URL interna do recurso Postgres do Coolify)}
      NODE_ENV: ${NODE_ENV:-production}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Dela's Vibe PDV}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-__Host-pdv_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-__Host-pdv_csrf}
      NEXT_PUBLIC_CSRF_COOKIE_NAME: ${NEXT_PUBLIC_CSRF_COOKIE_NAME:-__Host-pdv_csrf}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      CUSTOMER_SESSION_COOKIE_NAME: ${CUSTOMER_SESSION_COOKIE_NAME:-__Host-customer_session}
      CUSTOMER_CSRF_COOKIE_NAME: ${CUSTOMER_CSRF_COOKIE_NAME:-__Host-customer_csrf}
      CUSTOMER_SESSION_TTL_HOURS: ${CUSTOMER_SESSION_TTL_HOURS:-168}
      WEB_ORDER_PENDING_TTL_MINUTES: ${WEB_ORDER_PENDING_TTL_MINUTES:-60}
      NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME:?NEXT_PUBLIC_STORE_NAME is required}
      NEXT_PUBLIC_STORE_ADDRESS: ${NEXT_PUBLIC_STORE_ADDRESS:?NEXT_PUBLIC_STORE_ADDRESS is required}
      NEXT_PUBLIC_STORE_PHONE: ${NEXT_PUBLIC_STORE_PHONE:?NEXT_PUBLIC_STORE_PHONE is required}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "3000"

volumes:
  uploads_data:
