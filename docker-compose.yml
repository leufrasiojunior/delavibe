name: delavibe

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: delavibe
      POSTGRES_USER: delavibe
      POSTGRES_PASSWORD: delavibe
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delavibe -d delavibe"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: delavibe/app:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://delavibe:delavibe@db:5432/delavibe?schema=public
      SESSION_COOKIE_NAME: pdv_session
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_NAME: pdv_csrf
      NEXT_PUBLIC_CSRF_COOKIE_NAME: pdv_csrf
      SESSION_TTL_HOURS: "12"
      APP_TIMEZONE: America/Sao_Paulo
      NEXT_PUBLIC_APP_NAME: "Dela's Vibe PDV"
      TZ: America/Sao_Paulo
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3010:3000"

  migrate:
    image: delavibe/migrate:local
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    environment:
      DATABASE_URL: postgresql://delavibe:delavibe@db:5432/delavibe?schema=public
      SESSION_COOKIE_NAME: pdv_session
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_NAME: pdv_csrf
      NEXT_PUBLIC_CSRF_COOKIE_NAME: pdv_csrf
      SESSION_TTL_HOURS: "12"
      APP_TIMEZONE: America/Sao_Paulo
      NEXT_PUBLIC_APP_NAME: "Dela's Vibe PDV"
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]

  seed:
    image: delavibe/seed:local
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    profiles: ["seed"]
    environment:
      DATABASE_URL: postgresql://delavibe:delavibe@db:5432/delavibe?schema=public
      SESSION_COOKIE_NAME: pdv_session
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_NAME: pdv_csrf
      NEXT_PUBLIC_CSRF_COOKIE_NAME: pdv_csrf
      SESSION_TTL_HOURS: "12"
      APP_TIMEZONE: America/Sao_Paulo
      NEXT_PUBLIC_APP_NAME: "Dela's Vibe PDV"
      TZ: America/Sao_Paulo
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "db:seed"]

volumes:
  postgres_data:
