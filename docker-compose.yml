# Ambiente exclusivo para desenvolvimento/local.
# Não use este arquivo como base de produção.
#
# Subir: npm run up  (ou: docker compose up -d)
# Aplicar migrations: o entrypoint do container app roda
#   `prisma migrate deploy` automaticamente toda vez que o app inicia.
# Seed manual (não automático): docker compose exec app npm run db:seed
name: delavibe

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delavibe}
      POSTGRES_USER: ${POSTGRES_USER:-delavibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-delavibe} -d ${POSTGRES_DB:-delavibe}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: delavibe/app:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-delavibe}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-delavibe}?schema=public
      SESSION_COOKIE_NAME: pdv_session
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_NAME: pdv_csrf
      NEXT_PUBLIC_CSRF_COOKIE_NAME: pdv_csrf
      SESSION_TTL_HOURS: "12"
      APP_TIMEZONE: America/Sao_Paulo
      NEXT_PUBLIC_APP_NAME: "Dela's Vibe PDV"
      TZ: America/Sao_Paulo
      UPLOADS_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3010:3000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
