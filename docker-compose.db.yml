# Stack standalone do Postgres — usado em Coolify como serviço/stack
# SEPARADO do app (no mesmo projeto). O app alcança esta instância via
# DNS interno do Coolify configurando DATABASE_URL no stack do app.
#
# Sobrevive a deploys do app: subir/recriar o stack do app NÃO afeta
# este stack.
services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delavibe}
      POSTGRES_USER: ${POSTGRES_USER:-delavibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-delavibe} -d ${POSTGRES_DB:-delavibe}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
