# Homolog: igual produção (stack apenas da aplicação), mas com porta
# host exposta para acesso direto (sem precisar de proxy/Traefik).
# O banco roda como recurso separado no Coolify — DATABASE_URL aponta
# pra URL interna dele.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://delavibe:28fca2c505be8a19339822f212d901900bba6f0d16798fc9@postgres:5432/delavibe?schema=public
      NODE_ENV: production
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_NAME: __Host-pdv_session
      CSRF_COOKIE_NAME: __Host-pdv_csrf
      NEXT_PUBLIC_CSRF_COOKIE_NAME: __Host-pdv_csrf
      SESSION_TTL_HOURS: "12"
      APP_TIMEZONE: America/Sao_Paulo
      NEXT_PUBLIC_APP_NAME: "Dela's Vibe PDV"
      TRUST_PROXY_HEADERS: "true"
      TZ: America/Sao_Paulo
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${APP_HOST_PORT:-3011}:3000"

volumes:
  uploads_data:
